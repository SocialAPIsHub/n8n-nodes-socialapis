<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Blue rounded background -->
  <rect width="60" height="60" rx="12" fill="#4A7CF7"/>

  <!-- Left arm (top-left to mid-left) -->
  <line x1="16" y1="16" x2="22" y2="30" stroke="#B0B8C8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left arm lower (mid-left to center) -->
  <line x1="22" y1="30" x2="30" y2="40" stroke="#B0B8C8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right arm (top-right to mid-right) -->
  <line x1="44" y1="16" x2="38" y2="30" stroke="#B0B8C8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right arm lower (mid-right to center) -->
  <line x1="38" y1="30" x2="30" y2="40" stroke="#B0B8C8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left small extension -->
  <line x1="22" y1="30" x2="17" y2="36" stroke="#C8D0DC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right small extension -->
  <line x1="38" y1="30" x2="43" y2="36" stroke="#C8D0DC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top-left circle -->
  <circle cx="16" cy="15" r="5.5" fill="white"/>
  <!-- Top-right circle -->
  <circle cx="44" cy="15" r="5.5" fill="white"/>

  <!-- Mid-left node (purple) -->
  <circle cx="22" cy="30" r="3" fill="#7B61C7"/>
  <!-- Mid-right node (purple) -->
  <circle cx="38" cy="30" r="3" fill="#7B61C7"/>

  <!-- Center bottom circle -->
  <circle cx="30" cy="41" r="7" fill="white"/>
  <circle cx="30" cy="41" r="3.2" fill="#C9AEEA"/>
</svg>
